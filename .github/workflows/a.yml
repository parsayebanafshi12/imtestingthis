name: Sync Panel-Sloper to My Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone source repo
        run: |
          set -e
          SRC_DIR="/tmp/sloper-src"
          rm -rf "$SRC_DIR"
          git clone --depth 1 https://github.com/noperi0000-netizen/Panel-Sloper.git "$SRC_DIR"

      - name: Copy files (excluding .git)
        run: |
          set -e

          # حذف .git مخزن مبدأ (حیاتی برای push)
          rm -rf /tmp/sloper-src/.git

          # پاک‌سازی محتوای پروژه به جز .git و .github
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          # کپی همه‌ی محتوا (شامل فایل‌های مخفی مثل .gitignore و .railway)
          cp -r /tmp/sloper-src/. .

          # نمایش وضعیت
          git status --short | head -30

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "چیزی برای کامیت نیست."
          else
            git commit -m "Railway Deploy"
            git push
          fi
